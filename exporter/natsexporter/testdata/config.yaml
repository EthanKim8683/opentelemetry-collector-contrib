nats:
  server: nats://localhost:1234
  servers: [
    "nats://localhost:1235",
    "nats://localhost:1236",
    "nats://localhost:1237",
  ]
  tls:
  pedantic: true
  compression: true
  logs:
    subject: "\"otel_logs\""
    marshaler: "otlp_json"
    encoding_extension: "encoding"
  metrics:
    subject: "\"otel_metrics\""
    marshaler: "otlp_json"
    encoding_extension: "encoding"
  traces:
    subject: "\"otel_traces\""
    marshaler: "otlp_json"
    encoding_extension: "encoding"
  jetstream:
    enabled: true
    retry_wait: 2s
    retry_attempts: 3
    stall_wait: 4s
    deduplication: true
  sending_queue:
  auth:
    token:
      token: "token"
    user:
      username: "user"
      password: "password"